[package]
name = "browser"
tool = "kryon"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]
links = ["m", "dl", "pthread"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "c6bf5cbf5dc6782f819580b3db488d223002076e"
[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
library = "X11"
static_archive = "build/quickjs/libbrowser_script.a"

[install]
bin = "kryon-browser"

[tool.kryon.install]
profile = "desktop"
name = "Browser"
comment = "Native HTML and CSS browser"
categories = "Network;WebBrowser;"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "0a86415bff1bd18dc5587431e634a3e2d6be1351"
